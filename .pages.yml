# Pages CMS reads this from the repository root.
# Keep this file next to package.json (the Astro project).
media:
  - name: images
    label: Images
    input: src/images/content
    output: '@images/content'
  - name: documents
    label: Documents
    input: public/data/protocols
    output: /data/protocols
    extensions: [pdf, doc, docx]
content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/articles/en
    format: yaml-frontmatter
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      primary: title
      sort: publishDate
      order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: publishDate
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: excerpt
        type: text
      - name: draft
        type: boolean
      - name: featured
        type: boolean
      - name: image
        type: object
        fields:
          - name: file
            type: image
            options:
              media: images
          - name: alt
            type: string
      - name: body
        type: rich-text

  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: year
      order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: authors
        type: string
        required: true
      - name: year
        type: number
      - name: source
        type: string
      - name: doi
        type: string
      - name: url
        type: string
      - name: draft
        type: boolean
      - name: body
        type: rich-text

  - name: cruises
    label: Cruises
    type: collection
    path: src/content/cruises
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
        options:
          format: yyyy-MM-dd
      - name: caption
        type: text
      - name: draft
        type: boolean
      - name: image
        type: object
        fields:
          - name: file
            type: image
            options:
              media: images
          - name: alt
            type: string
      - name: body
        type: rich-text

  - name: team
    label: Team
    type: collection
    path: src/content/team
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: name
    fields:
      - name: name
        type: string
        required: true
      - name: role
        type: string
      - name: affiliation
        type: string
      - name: group
        label: Team
        type: select
        required: true
        options:
          values:
            - name: usa
              label: USA
            - name: international
              label: International
      - name: order
        type: number
      - name: draft
        type: boolean
      - name: photo
        type: object
        fields:
          - name: file
            type: image
            options:
              media: images
          - name: alt
            type: string
      - name: body
        type: rich-text

  - name: protocols
    label: Protocols
    type: collection
    path: src/content/protocols
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      sort: publishDate
      order: desc
    fields:
      - name: title
        type: string
        required: true
      - name: description
        type: text
        required: true
      - name: category
        type: string
        required: true
      - name: file
        label: Protocol file
        type: file
        options:
          media: documents
          extensions: [pdf, doc, docx]
      - name: url
        label: External file URL
        type: string
        description: Use this if the PDF or Word file is hosted elsewhere instead of uploaded here.
      - name: publishDate
        type: date
        options:
          format: yyyy-MM-dd
      - name: updateDate
        type: date
        options:
          format: yyyy-MM-dd
      - name: draft
        type: boolean
      - name: body
        type: rich-text

  - name: faq
    label: FAQ
    type: collection
    path: src/content/faq-answers/en
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: question
    fields:
      - name: question
        type: string
        required: true
      - name: category
        type: string
      - name: draft
        type: boolean
      - name: body
        type: rich-text
